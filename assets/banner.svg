<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    /* Background Animated Pulses */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    .bg-pulse {
      transform-origin: 950px 200px;
      animation: pulseGlow 6s ease-in-out infinite;
    }

    /* Dynamic Floating Financial Chart Bars */
    @keyframes barRise {
      0%, 100% { height: 60px; y: 260px; }
      50% { height: 110px; y: 210px; }
    }
    @keyframes barRise2 {
      0%, 100% { height: 100px; y: 220px; }
      50% { height: 140px; y: 180px; }
    }
    @keyframes barRise3 {
      0%, 100% { height: 80px; y: 240px; }
      50% { height: 130px; y: 190px; }
    }
    .bar-anim-1 { animation: barRise 4s ease-in-out infinite; }
    .bar-anim-2 { animation: barRise2 5s ease-in-out infinite; }
    .bar-anim-3 { animation: barRise3 4.5s ease-in-out infinite; }

    /* Animated Dynamic Line Path */
    @keyframes dashOffset {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .trend-line {
      stroke-dasharray: 400;
      animation: dashOffset 8s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Glowing Background Orbs (Behind content) -->
  <circle class="bg-pulse" cx="950" cy="200" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="200" cy="100" r="120" fill="#a855f7" opacity="0.1" filter="url(#glow)" />

  <!-- Graphic Elements (Right Side - Low z-index background context) -->
  <g transform="translate(720, 60)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="420" height="280" rx="14" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
    
    <!-- Header of Card -->
    <circle cx="30" cy="30" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="50" cy="30" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="70" cy="30" r="6" fill="#10b981" opacity="0.8" />
    <text x="390" y="34" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">FINOPS COST ALLOCATION</text>
    <line x1="20" y1="50" x2="400" y2="50" stroke="#ffffff" stroke-opacity="0.1" />

    <!-- Animated Chart Bars -->
    <rect class="bar-anim-1" x="50" y="240" width="36" height="80" rx="6" fill="#6366f1" opacity="0.8" />
    <rect class="bar-anim-2" x="110" y="200" width="36" height="120" rx="6" fill="#8b5cf6" opacity="0.85" />
    <rect class="bar-anim-3" x="170" y="220" width="36" height="100" rx="6" fill="#ec4899" opacity="0.8" />
    <rect class="bar-anim-1" x="230" y="190" width="36" height="130" rx="6" fill="#3b82f6" opacity="0.9" />
    <rect class="bar-anim-2" x="290" y="160" width="36" height="160" rx="6" fill="#10b981" opacity="0.95" />

    <!-- Trend line overlay -->
    <path class="trend-line" d="M 68 230 L 128 190 L 188 210 L 248 160 L 308 120 L 370 90" fill="none" stroke="#f59e0b" stroke-width="3" filter="url(#glow)" />
    <circle cx="370" cy="90" r="5" fill="#f59e0b" />
  </g>

  <!-- Foregound Text Content (Layered above graphic elements for total readability) -->
  <g transform="translate(70, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="16" y="21" class="badge-text">💰 FINOPS &amp; CLOUD COST GOVERNANCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" class="title">
      Awesome Cloud Billing &amp;
    </text>
    <text x="0" y="215" class="title" fill="url(#accentGrad)">
      Chargeback Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="265" class="subtitle">
      Curated enterprise FinOps platforms &amp; open-source cost engines
    </text>
    <text x="0" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
      AWS Billing Conductor • Kubecost • CloudZero • OpenCost • Chitragupta
    </text>

    <!-- Bottom Accent Bar -->
    <rect x="0" y="335" width="480" height="4" rx="2" fill="url(#accentGrad)" />
  </g>
</svg>
