<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes barRise{0%{height:60px;y:260px}50%{height:110px;y:210px}}@keyframes barRise2{0%{height:100px;y:220px}50%{height:140px;y:180px}}@keyframes barRise3{0%{height:80px;y:240px}50%{height:130px;y:190px}}@keyframes dashOffset{0%{stroke-dashoffset:400}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.bg-pulse{transform-origin:950px 200px;animation:pulseGlow 6s ease-in-out infinite}.bar-anim-1{animation:barRise 4s ease-in-out infinite}.bar-anim-2{animation:barRise2 5s ease-in-out infinite}.bar-anim-3{animation:barRise3 4.5s ease-in-out infinite}.trend-line{stroke-dasharray:400;animation:dashOffset 8s linear infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g stroke="#fff" stroke-opacity=".04" stroke-width="1"><line x1="0" x2="1200" y1="80" y2=